<!DOCTYPE html>
<html lang="en-US">
    <!--
        This page serves as both the site's homepage and the place where all
        content and metadata is set. Because all other pages on this site are just
        HTML fragments that get injected into this page, if any of them are visited
        before this one, this one will need to be fetched as well so the page can be
        rebuilt properly.
        Reusable components used throughout the site are also fetched whenever this
        page is loaded (including when another page fetches it), but for ease of
        maintenance, these components are kept in separate files and fetched on page
        load.
    -->
    <head>
        <!-- === Site metadata === -->
        <!-- Site basics -->
        <meta charset="utf-8"/>
        <link href="favicon.ico" rel="icon"/>
        <meta name="Viewport" content="width=device-width, initial-scale=1.0"/>

        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&family=Oxanium:wght@200..800&display=swap" rel="stylesheet">

        <!-- Site styles -->
        <link rel="stylesheet" href="globals.css"/>
        <!-- Tile styles -->
        <link rel="stylesheet" href="tile-link.css"/>

        <!-- === Page metadata === -->
        <!--Page basics -->
        <title>Collin Vesel</title>
        <meta name="description" content="My personal website. Includes some basic information about me and I hope to add (many) other features soon. :)"/>

        <!-- Page styles -->
        <link rel="stylesheet" href="homepage.css"/>
    </head>
    <body>
        <!-- Homepage header -->
        <header class="orbitron-collinvesel">
            <h1>I&apos;m Collin Vesel</h1>
            <p>and I made some things</p>
        </header>
        <!-- Homepage tiles -->
        <main id="HomescreenTiles">
            <a class="TileLink oxanium-collinvesel" href="bio.html">Bio</a>
            <a class="TileLink oxanium-collinvesel" href="resume.html">Resume</a>
            <a class="TileLink oxanium-collinvesel" href="socials.html">Socials</a>
        </main>
        <!-- Footer -->
        <footer class="oxanium-collinvesel">

</html>
